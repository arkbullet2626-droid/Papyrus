# Builds the engine and the setup wizard, then publishes them as a GitHub release.
# Runs whenever the VERSION file changes on main (or by hand from the Actions tab).
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build engine
        shell: bash
        env:
          PYTHON: python
        run: |
          python -m pip install --quiet ziglang
          sh build.sh

      - name: Build setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\papyrus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          notes="docs/releases/v$V.md"
          [ -f "$notes" ] || { mkdir -p docs/releases; echo "Papyrus $V" > "$notes"; }
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "dist/Papyrus-Setup-$V.exe" --clobber
          else
            gh release create "v$V" "dist/Papyrus-Setup-$V.exe" --title "Papyrus $V" --notes-file "$notes" --target "$GITHUB_SHA"
          fi
