# Builds the engine, the Papyrus app and the setup wizard.
#   - push to main: also publishes a GitHub release for the version in VERSION, if that release does not exist yet
#   - push to a dev/ branch or a manual run: build only; the installer is attached to the run as an artifact
name: Release

on:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build engine
        shell: bash
        env:
          PYTHON: python
        run: |
          python -m pip install --quiet ziglang
          sh build.sh

      - name: Publish Papyrus app
        shell: pwsh
        run: >
          dotnet publish app/Papyrus.csproj
          -c Release -r win-x64 -p:Platform=x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o dist/app

      - name: Build setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\papyrus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe

      - uses: actions/upload-artifact@v5
        with:
          name: Papyrus-Setup-${{ steps.ver.outputs.version }}
          path: dist/Papyrus-Setup-*.exe

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists - nothing to publish."
            exit 0
          fi
          notes="docs/releases/v$V.md"
          [ -f "$notes" ] || { mkdir -p docs/releases; echo "Papyrus $V" > "$notes"; }
          gh release create "v$V" "dist/Papyrus-Setup-$V.exe" --title "Papyrus $V" --notes-file "$notes" --target "$GITHUB_SHA"
